<!DOCTYPE html>
<html>

<head>
    <title>GradCasino Graph Viewer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@dagrejs/dagre@1.1.2/dist/dagre.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
            background: #0d1117;
            overflow: hidden;
        }

        svg {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .node {
            cursor: pointer;
        }

        .node circle,
        .node rect {
            stroke-width: 2.5px;
            transition: filter 0.15s, stroke-width 0.15s;
        }

        .node:hover circle,
        .node:hover rect {
            stroke-width: 4px;
            filter: brightness(1.3) drop-shadow(0 0 12px currentColor);
        }

        .node text {
            font-size: 12px;
            font-weight: 600;
            fill: white;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .link {
            fill: none;
            stroke: #30363d;
            stroke-width: 2px;
            transition: stroke 0.2s;
        }

        .link-arrow {
            fill: #484f58;
        }

        #controls {
            position: absolute;
            top: 16px;
            left: 16px;
            background: #161b22;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid #30363d;
        }

        #controls h3 {
            color: #f0f6fc;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        button {
            padding: 6px 12px;
            margin: 2px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #21262d;
            color: #c9d1d9;
            font-size: 11px;
            cursor: pointer;
        }

        button:hover {
            background: #30363d;
        }

        input[type="file"] {
            color: #8b949e;
            margin-bottom: 8px;
            display: block;
            font-size: 11px;
        }

        #legend {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: #161b22;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #30363d;
            color: #8b949e;
            font-size: 10px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            margin: 3px 0;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        #hint {
            position: absolute;
            bottom: 16px;
            left: 16px;
            color: #484f58;
            font-size: 10px;
        }
    </style>
</head>

<body>
    <div id="controls">
        <h3>🎰 GradCasino</h3>
        <input type="file" id="file-input" accept=".json" />
        <button onclick="loadExample()">Load Example</button>
        <button onclick="resetLayout()">Reset Layout</button>
        <button onclick="resetView()">Fit View</button>
    </div>
    <div id="legend">
        <div class="legend-row">
            <div class="legend-dot" style="background:#3fb950"></div>Input
        </div>
        <div class="legend-row">
            <div class="legend-dot" style="background:#d29922"></div>Param
        </div>
        <div class="legend-row">
            <div class="legend-dot" style="background:#58a6ff"></div>Constant
        </div>
        <div class="legend-row">
            <div class="legend-dot" style="background:#8b949e"></div>Operation
        </div>
        <div class="legend-row">
            <div class="legend-dot" style="background:#f85149"></div>Output
        </div>
    </div>
    <div id="hint">Scroll to zoom • Drag background to pan</div>
    <svg></svg>

    <script>
        const colors = {
            Input: { fill: '#238636', stroke: '#3fb950' },
            Param: { fill: '#9e6a03', stroke: '#d29922' },
            Constant: { fill: '#1f6feb', stroke: '#58a6ff' },
            Grad: { fill: '#da3633', stroke: '#f85149' },
            Loop: { fill: '#8957e5', stroke: '#a371f7' },
            default: { fill: '#484f58', stroke: '#6e7681' }
        };

        const width = window.innerWidth;
        const height = window.innerHeight;
        const svg = d3.select('svg');
        const g = svg.append('g');

        // Zoom
        const zoom = d3.zoom().scaleExtent([0.2, 3]).on('zoom', e => g.attr('transform', e.transform));
        svg.call(zoom);

        function resetView() {
            const bounds = g.node().getBBox();
            const scale = Math.min(width / (bounds.width + 100), height / (bounds.height + 100), 1);
            const tx = (width - bounds.width * scale) / 2 - bounds.x * scale;
            const ty = (height - bounds.height * scale) / 2 - bounds.y * scale;
            svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
        }

        // Arrow marker
        svg.append('defs').append('marker')
            .attr('id', 'arrow')
            .attr('viewBox', '0 -5 10 10')
            .attr('refX', 10)
            .attr('refY', 0)
            .attr('markerWidth', 8)
            .attr('markerHeight', 8)
            .attr('orient', 'auto')
            .append('path')
            .attr('class', 'link-arrow')
            .attr('d', 'M0,-4L10,0L0,4Z');

        let nodes = [], links = [], nodeElements, linkElements;
        let currentData = null;

        function computeLayout(data) {
            const dagreG = new dagre.graphlib.Graph();
            dagreG.setGraph({ rankdir: 'TB', nodesep: 60, ranksep: 80, marginx: 40, marginy: 40 });
            dagreG.setDefaultEdgeLabel(() => ({}));

            data.elements.nodes.forEach(n => {
                const isLeaf = ['Input', 'Param', 'Constant'].includes(n.data.kind);
                dagreG.setNode(n.data.id, {
                    label: n.data.label,
                    kind: n.data.kind,
                    width: isLeaf ? 50 : 80,
                    height: isLeaf ? 50 : 36
                });
            });

            data.elements.edges.forEach(e => {
                dagreG.setEdge(e.data.source, e.data.target);
            });

            dagre.layout(dagreG);
            return dagreG;
        }

        function renderGraph(data, animate = true) {
            currentData = data;
            g.selectAll('*').remove();

            const dagreG = computeLayout(data);

            // Build node/link data
            nodes = [];
            const nodeMap = new Map();
            dagreG.nodes().forEach(id => {
                const n = dagreG.node(id);
                const node = { id, x: n.x, y: n.y, label: n.label, kind: n.kind, width: n.width, height: n.height };
                nodes.push(node);
                nodeMap.set(id, node);
            });

            links = dagreG.edges().map(e => ({
                source: nodeMap.get(e.v),
                target: nodeMap.get(e.w),
                points: dagreG.edge(e).points
            }));

            // Draw links
            const linkG = g.append('g');
            linkElements = linkG.selectAll('.link')
                .data(links)
                .join('path')
                .attr('class', 'link')
                .attr('marker-end', 'url(#arrow)')
                .attr('d', d => linkPath(d.points));


            // Draw nodes
            const nodeG = g.append('g');
            nodeElements = nodeG.selectAll('.node')
                .data(nodes)
                .join('g')
                .attr('class', 'node')
                .attr('transform', d => `translate(${d.x}, ${d.y})`);

            nodeElements.each(function (d) {
                const el = d3.select(this);
                const color = colors[d.kind] || colors.default;
                const isLeaf = ['Input', 'Param', 'Constant'].includes(d.kind);

                if (isLeaf) {
                    el.append('circle')
                        .attr('r', 24)
                        .attr('fill', color.fill)
                        .attr('stroke', color.stroke)
                        .style('color', color.stroke);
                } else {
                    el.append('rect')
                        .attr('x', -d.width / 2)
                        .attr('y', -d.height / 2)
                        .attr('width', d.width)
                        .attr('height', d.height)
                        .attr('rx', 8)
                        .attr('fill', color.fill)
                        .attr('stroke', color.stroke)
                        .style('color', color.stroke);
                }

                el.append('text').text(d.label);
            });

            if (animate) {
                setTimeout(resetView, 50);
            }
        }

        function linkPath(points) {
            const line = d3.line().curve(d3.curveBasis);
            return line(points.map(p => [p.x, p.y]));
        }

        function updateLinksFor(movedNode) {
            // Only update edges connected to the moved node
            linkElements.each(function (d) {
                const isAffected = d.source.id === movedNode.id || d.target.id === movedNode.id;
                if (!isAffected) return; // Keep original dagre path

                const sx = d.source.x, sy = d.source.y;
                const tx = d.target.x, ty = d.target.y;

                // Calculate target point offset for arrow
                const isTargetLeaf = ['Input', 'Param', 'Constant'].includes(d.target.kind);
                const offset = isTargetLeaf ? 26 : 20;

                const dx = tx - sx, dy = ty - sy;
                const len = Math.sqrt(dx * dx + dy * dy) || 1;
                const endX = tx - (dx / len) * offset;
                const endY = ty - (dy / len) * offset;

                const line = d3.line().curve(d3.curveBasis);
                const points = [[sx, sy], [sx, (sy + endY) / 2], [endX, (sy + endY) / 2], [endX, endY]];
                d3.select(this).attr('d', line(points));
            });
        }

        function dragStarted(event, d) {
            d3.select(this).raise();
        }

        function dragged(event, d) {
            d.x = event.x;
            d.y = event.y;
            d3.select(this)
                .attr('transform', `translate(${d.x}, ${d.y})`);
            updateLinksFor(d); // Quick update while dragging
        }

        function dragEnded(event, d) {
            // Re-run dagre to get properly routed edges
            recomputeEdges();
        }

        function recomputeEdges() {
            // Build dagre graph with current node positions
            const dagreG = new dagre.graphlib.Graph();
            dagreG.setGraph({ rankdir: 'TB', nodesep: 60, ranksep: 80, marginx: 40, marginy: 40 });
            dagreG.setDefaultEdgeLabel(() => ({}));

            // Use current positions as fixed
            nodes.forEach(n => {
                const isLeaf = ['Input', 'Param', 'Constant'].includes(n.kind);
                dagreG.setNode(n.id, {
                    x: n.x, y: n.y, // Use current position
                    width: isLeaf ? 50 : 80,
                    height: isLeaf ? 50 : 36
                });
            });

            links.forEach(l => {
                dagreG.setEdge(l.source.id, l.target.id);
            });

            // Only compute edge routing, not node positions
            dagre.layout(dagreG);

            // Update link paths with new dagre-computed routes
            links.forEach((l, i) => {
                const edge = dagreG.edge(l.source.id, l.target.id);
                if (edge) l.points = edge.points;
            });

            // Re-render edges with new paths
            linkElements.attr('d', d => linkPath(d.points));
        }

        function resetLayout() {
            if (currentData) renderGraph(currentData, false);
        }

        document.getElementById('file-input').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => renderGraph(JSON.parse(ev.target.result));
            reader.readAsText(file);
        });

        function loadExample() {
            const data = { "elements": { "nodes": [{ "data": { "id": "n0", "label": "input\nS₀", "kind": "Input" } }, { "data": { "id": "n1", "label": "input\ndW", "kind": "Input" } }, { "data": { "id": "n2", "label": "param\nK", "kind": "Param" } }, { "data": { "id": "n3", "label": "param\nσ", "kind": "Param" } }, { "data": { "id": "n4", "label": "param\nr", "kind": "Param" } }, { "data": { "id": "n5", "label": "param\nT", "kind": "Param" } }, { "data": { "id": "n6", "label": "const", "kind": "Constant" } }, { "data": { "id": "n7", "label": "×", "kind": "Mul" } }, { "data": { "id": "n8", "label": "×", "kind": "Mul" } }, { "data": { "id": "n9", "label": "-", "kind": "Sub" } }, { "data": { "id": "n10", "label": "×", "kind": "Mul" } }, { "data": { "id": "n11", "label": "√", "kind": "Sqrt" } }, { "data": { "id": "n12", "label": "×", "kind": "Mul" } }, { "data": { "id": "n13", "label": "×", "kind": "Mul" } }, { "data": { "id": "n14", "label": "+", "kind": "Add" } }, { "data": { "id": "n15", "label": "exp", "kind": "Exp" } }, { "data": { "id": "n16", "label": "×\nS_T", "kind": "Mul" } }, { "data": { "id": "n17", "label": "-", "kind": "Sub" } }, { "data": { "id": "n18", "label": "const", "kind": "Constant" } }, { "data": { "id": "n19", "label": "max\npayoff", "kind": "Max" } }, { "data": { "id": "n20", "label": "-", "kind": "Neg" } }, { "data": { "id": "n21", "label": "×", "kind": "Mul" } }, { "data": { "id": "n22", "label": "exp\ndiscount", "kind": "Exp" } }, { "data": { "id": "n23", "label": "×\nPV", "kind": "Mul" } }, { "data": { "id": "n24", "label": "∇\nΔ", "kind": "Grad" } }], "edges": [{ "data": { "id": "e6_7", "source": "n6", "target": "n7", "label": "0" } }, { "data": { "id": "e3_7", "source": "n3", "target": "n7", "label": "1" } }, { "data": { "id": "e7_8", "source": "n7", "target": "n8", "label": "0" } }, { "data": { "id": "e3_8", "source": "n3", "target": "n8", "label": "1" } }, { "data": { "id": "e4_9", "source": "n4", "target": "n9", "label": "0" } }, { "data": { "id": "e8_9", "source": "n8", "target": "n9", "label": "1" } }, { "data": { "id": "e9_10", "source": "n9", "target": "n10", "label": "0" } }, { "data": { "id": "e5_10", "source": "n5", "target": "n10", "label": "1" } }, { "data": { "id": "e5_11", "source": "n5", "target": "n11" } }, { "data": { "id": "e3_12", "source": "n3", "target": "n12", "label": "0" } }, { "data": { "id": "e11_12", "source": "n11", "target": "n12", "label": "1" } }, { "data": { "id": "e12_13", "source": "n12", "target": "n13", "label": "0" } }, { "data": { "id": "e1_13", "source": "n1", "target": "n13", "label": "1" } }, { "data": { "id": "e10_14", "source": "n10", "target": "n14", "label": "0" } }, { "data": { "id": "e13_14", "source": "n13", "target": "n14", "label": "1" } }, { "data": { "id": "e14_15", "source": "n14", "target": "n15" } }, { "data": { "id": "e0_16", "source": "n0", "target": "n16", "label": "0" } }, { "data": { "id": "e15_16", "source": "n15", "target": "n16", "label": "1" } }, { "data": { "id": "e16_17", "source": "n16", "target": "n17", "label": "0" } }, { "data": { "id": "e2_17", "source": "n2", "target": "n17", "label": "1" } }, { "data": { "id": "e17_19", "source": "n17", "target": "n19", "label": "0" } }, { "data": { "id": "e18_19", "source": "n18", "target": "n19", "label": "1" } }, { "data": { "id": "e4_20", "source": "n4", "target": "n20" } }, { "data": { "id": "e20_21", "source": "n20", "target": "n21", "label": "0" } }, { "data": { "id": "e5_21", "source": "n5", "target": "n21", "label": "1" } }, { "data": { "id": "e21_22", "source": "n21", "target": "n22" } }, { "data": { "id": "e19_23", "source": "n19", "target": "n23", "label": "0" } }, { "data": { "id": "e22_23", "source": "n22", "target": "n23", "label": "1" } }, { "data": { "id": "e23_24", "source": "n23", "target": "n24", "label": "0" } }, { "data": { "id": "e0_24", "source": "n0", "target": "n24", "label": "1" } }] } };
            renderGraph(data);
        }

        loadExample();
    </script>
</body>

</html>
